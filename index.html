<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="icon.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> PROGRAMA DE EVENTOS DO CÍRIO DE NAZARÉ 2026 </title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#002D5E', dark: '#001D3D', light: '#004085' },
            gold: { DEFAULT: '#FFB800', dark: '#d99b00', light: '#ffe680' },
            amareloOvo: { DEFAULT: '#FFB800', dark: '#d99b00', light: '#ffe680' }
          },
          fontFamily: { 
            sans: ['Inter', 'sans-serif'],
            cursive: ['Dancing Script', 'cursive']
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full bg-slate-50 font-sans text-slate-800 antialiased pb-16">

  <!-- HEADER FIXO COMPLETO -->
  <header class="sticky top-0 z-30 bg-white border-b-2 border-amareloOvo shadow-lg relative">
    <div class="max-w-5xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-3.5">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center flex-shrink-0">
            <img src="brasao-4dn.png" alt="Brasão 4ºDN" class="w-full h-full object-contain">
          </div>
          <div>
            <span class="text-[11px] tracking-widest font-black uppercase text-slate-600 block leading-tight">Marinha do Brasil</span>
            <h1 class="text-xl sm:text-3xl font-cursive text-amareloOvo-dark tracking-wide leading-tight">Círio de Nazaré 2026</h1>
            <p class="text-xs sm:text-sm text-slate-600 font-bold truncate max-w-[250px] sm:max-w-none">
              Comando do 4º Distrito Naval
            </p>
          </div>
        </div>
        <div class="w-12 h-12 sm:w-16 sm:h-16 flex items-center justify-center flex-shrink-0 pr-2 sm:pr-6">
          <img src="logo-cirio.png" alt="Logo Círio" class="w-full h-full object-contain">
        </div>
      </div>
    </div>
    
    <div class="bg-navy-dark/95 border-t border-white/10 px-2 sm:px-4">
      <div class="max-w-5xl mx-auto flex space-x-2 overflow-x-auto py-2.5 no-scrollbar" id="daysTabContainer"></div>
    </div>

    <!-- PAINEL DE FILTROS RECOLHÍVEL -->
    <div class="bg-navy-dark/90 border-t border-white/10 shadow-inner">
      <div class="max-w-5xl mx-auto">
        <button onclick="toggleFiltersPanel()" class="w-full px-4 py-2.5 flex items-center justify-between text-amareloOvo text-xs sm:text-sm font-black uppercase tracking-wider hover:bg-white/5 transition">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-filter text-amareloOvo text-sm"></i>
            <span>FILTRAR ATIVIDADES</span>
            <span id="activeFiltersBadge" class="hidden bg-amareloOvo text-navy-dark text-[10px] px-2 py-0.5 rounded-full font-extrabold ml-2">Ativo</span>
          </div>
          <i id="filterToggleIcon" class="fa-solid fa-chevron-down text-xs transition-transform duration-300"></i>
        </button>

        <div id="filtersContent" class="hidden px-4 pb-3 pt-1 border-t border-white/10">
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
            <div class="relative">
              <select id="filterTipoEvento" onchange="applyFilters()" class="w-full bg-slate-900/90 text-white border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amareloOvo appearance-none">
                <option value="">Tipo de Evento (Todos)</option>
                <option value="VAP">VAP</option>
                <option value="Círio">Círio</option>
                <option value="Cerimônia">Cerimônia</option>
                <option value="Almoço">Almoço</option>
                <option value="Jantar">Jantar</option>
                <option value="Deslocamento">Deslocamento</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
            </div>

            <div class="relative">
              <select id="filterParticipantes" onchange="applyFilters()" class="w-full bg-slate-900/90 text-white border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amareloOvo appearance-none">
                <option value="">Participantes (Todos)</option>
                <option value="V Alte Batista">V Alte Batista (DN-01)</option>
                <option value="C Alte José Fabio">C Alte José Fabio (DN-02)</option>
                <option value="Almirantes">Almirantes</option>
                <option value="Esposas">Esposas</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
            </div>

            <div class="relative">
              <select id="filterLocalCategoria" onchange="applyFilters()" class="w-full bg-slate-900/90 text-white border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amareloOvo appearance-none">
                <option value="">Local (Todos)</option>
                <option value="OM">OM</option>
                <option value="Navios">Navios</option>
                <option value="Residência do Com4DN">Residência do Com4DN</option>
                <option value="Clube Espadarte">Clube Espadarte</option>
                <option value="Restaurantes">Restaurantes</option>
                <option value="Aeroporto">Aeroporto</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
            </div>

            <button onclick="clearFilters()" class="flex items-center justify-center gap-1 px-2.5 py-1.5 bg-white/10 hover:bg-red-500/20 hover:text-red-300 border border-white/20 text-slate-200 font-extrabold text-xs rounded-xl transition active:scale-95">
              <i class="fa-solid fa-rotate-left text-[10px]"></i>
              <span>Limpar Filtros</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-5xl mx-auto px-3 sm:px-4 pt-4">
    <section class="mb-5 bg-white rounded-2xl shadow-sm border-2 border-amareloOvo p-2.5 sm:p-4">
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 sm:gap-3 text-center">
        <button onclick="openModal('modalAutoridades')" class="flex flex-col items-center justify-center p-2.5 rounded-xl hover:bg-slate-100 text-navy transition active:scale-95 min-h-[60px] border border-transparent hover:border-slate-200">
          <div class="w-9 h-9 rounded-xl bg-navy/10 flex items-center justify-center text-navy mb-1.5">
            <i class="fa-solid fa-user-shield text-lg"></i>
          </div>
          <span class="text-xs sm:text-sm font-bold leading-tight">Autoridades e Convidados</span>
        </button>
        
        <button onclick="openModal('modalAcomodacao')" class="flex flex-col items-center justify-center p-2.5 rounded-xl hover:bg-slate-100 text-navy transition active:scale-95 min-h-[60px] border border-transparent hover:border-slate-200">
          <div class="w-9 h-9 rounded-xl bg-navy/10 flex items-center justify-center text-navy mb-1.5">
            <i class="fa-solid fa-hotel text-lg"></i>
          </div>
          <span class="text-xs sm:text-sm font-bold leading-tight">Hospedagem dos Convidados</span>
        </button>

        <button onclick="openModal('modalUniformes')" class="flex flex-col items-center justify-center p-2.5 rounded-xl hover:bg-slate-100 text-navy transition active:scale-95 min-h-[60px] border border-transparent hover:border-slate-200">
          <div class="w-9 h-9 rounded-xl bg-navy/10 flex items-center justify-center text-navy mb-1.5">
            <i class="fa-solid fa-shirt text-lg"></i>
          </div>
          <span class="text-xs sm:text-sm font-bold leading-tight">Uniformes</span>
        </button>

        <button onclick="openModal('modalViaturas')" class="flex flex-col items-center justify-center p-2.5 rounded-xl hover:bg-slate-100 text-navy transition active:scale-95 min-h-[60px] border border-transparent hover:border-slate-200">
          <div class="w-9 h-9 rounded-xl bg-navy/10 flex items-center justify-center text-navy mb-1.5">
            <i class="fa-solid fa-car-side text-lg"></i>
          </div>
          <span class="text-xs sm:text-sm font-bold leading-tight">Viaturas</span>
        </button>

        <button onclick="openModal('modalVoos')" class="flex flex-col items-center justify-center p-2.5 rounded-xl hover:bg-sky-50 text-sky-700 transition active:scale-95 min-h-[60px] border border-transparent hover:border-sky-200">
          <div class="w-9 h-9 rounded-xl bg-sky-500/10 flex items-center justify-center text-sky-600 mb-1.5">
            <i class="fa-solid fa-plane-departure text-lg"></i>
          </div>
          <span class="text-xs sm:text-sm font-bold leading-tight">Voos</span>
        </button>

        <button onclick="openModal('modalContatos')" class="flex flex-col items-center justify-center p-2.5 rounded-xl hover:bg-slate-100 text-navy transition active:scale-95 min-h-[60px] border border-transparent hover:border-slate-200">
          <div class="w-9 h-9 rounded-xl bg-navy/10 flex items-center justify-center text-navy mb-1.5">
            <i class="fa-solid fa-address-book text-lg"></i>
          </div>
          <span class="text-xs sm:text-sm font-bold leading-tight">Telefones Úteis</span>
        </button>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6 min-h-[420px]">
      <div class="flex items-center justify-between pb-3.5 mb-5 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <h2 class="text-base sm:text-xl font-black text-navy uppercase tracking-wider" id="currentDayTitle">
            Cronograma do Dia
          </h2>
        </div>
        <span class="text-xs sm:text-sm font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full" id="eventCountBadge">
          0 Eventos
        </span>
      </div>

      <div class="space-y-4" id="timelineContainer"></div>
    </section>
  </main>

  <!-- MODAL: VIATURAS E MOTORISTAS -->
  <div id="modalViaturas" class="fixed inset-0 bg-navy-dark/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-2xl rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
      <div class="p-4 bg-navy text-white flex items-center justify-between border-b border-amareloOvo/30">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-car-side text-amareloOvo text-lg"></i>
          <h3 class="font-extrabold text-lg">Controle de Viaturas e Motoristas</h3>
        </div>
        <button onclick="closeModal('modalViaturas')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-3 bg-slate-100 border-b border-slate-200">
        <div class="relative">
          <input type="text" id="viaturaFilterInput" oninput="renderViaturasModal()" placeholder="Buscar por autoridade, motorista, viatura ou placa..." class="w-full bg-white text-slate-800 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-navy placeholder:text-slate-400">
          <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
        </div>
      </div>

      <div class="p-4 sm:p-5 overflow-y-auto space-y-5" id="viaturasListContainer"></div>

      <div class="p-3 bg-slate-50 border-t border-slate-100 text-right">
        <button onclick="closeModal('modalViaturas')" class="px-5 py-2 bg-navy text-white text-sm font-bold rounded-xl hover:bg-navy-dark transition">
          Fechar
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: VOOS COM FILTROS E AGRUPAMENTO POR DIA E VOO -->
  <div id="modalVoos" class="fixed inset-0 bg-navy-dark/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-2xl rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
      <div class="p-4 bg-navy text-white flex items-center justify-between border-b border-amareloOvo/30">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-plane-departure text-amareloOvo text-lg"></i>
          <h3 class="font-extrabold text-lg">Controle de Voos</h3>
        </div>
        <button onclick="closeModal('modalVoos')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-3 bg-slate-100 border-b border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-2">
        <div class="relative">
          <select id="flightFilterDate" onchange="renderVoosModal()" class="w-full bg-white text-slate-800 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-navy appearance-none">
            <option value="">Todos os Dias</option>
            <option value="05/10/2026">05/10/2026</option>
            <option value="06/10/2026">06/10/2026</option>
            <option value="07/10/2026">07/10/2026</option>
            <option value="08/10/2026">08/10/2026</option>
            <option value="09/10/2026">09/10/2026</option>
            <option value="10/10/2026">10/10/2026</option>
            <option value="11/10/2026">11/10/2026</option>
            <option value="12/10/2026">12/10/2026</option>
            <option value="13/10/2026">13/10/2026</option>
            <option value="15/10/2026">15/10/2026</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
        </div>

        <div class="relative">
          <input type="text" id="flightFilterName" oninput="renderVoosModal()" placeholder="Buscar por nome da pessoa..." class="w-full bg-white text-slate-800 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-navy placeholder:text-slate-400">
          <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
        </div>
      </div>

      <div class="p-4 sm:p-5 overflow-y-auto space-y-5" id="voosListContainer"></div>

      <div class="p-3 bg-slate-50 border-t border-slate-100 text-right">
        <button onclick="closeModal('modalVoos')" class="px-5 py-2 bg-navy text-white text-sm font-bold rounded-xl hover:bg-navy-dark transition">
          Fechar
        </button>
      </div>
    </div>
  </div>

  <!-- DEMAIS MODAIS -->
  <div id="modalEvent" class="fixed inset-0 bg-navy-dark/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden transform transition-all max-h-[85vh] flex flex-col">
      <div class="p-4 bg-navy text-white flex items-center justify-between border-b border-amareloOvo/30">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-calendar-check text-amareloOvo text-lg"></i>
          <h3 class="font-extrabold text-base sm:text-lg">Detalhes da Atividade</h3>
        </div>
        <button onclick="closeModal('modalEvent')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-5 overflow-y-auto space-y-4" id="modalEventContent"></div>
      <div class="p-4 bg-slate-50 border-t border-slate-100 text-right">
        <button onclick="closeModal('modalEvent')" class="px-5 py-2.5 bg-navy text-white text-sm font-bold rounded-xl hover:bg-navy-dark transition">
          Fechar
        </button>
      </div>
    </div>
  </div>

  <div id="modalAutoridades" class="fixed inset-0 bg-navy-dark/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-3xl rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
      <div class="p-4 bg-navy text-white flex items-center justify-between border-b border-amareloOvo/30">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-amareloOvo text-xl"></i>
          <h3 class="font-black text-lg">Autoridades e Convidados</h3>
        </div>
        <button onclick="closeModal('modalAutoridades')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- BARRA DE FILTROS DO MENU DE AUTORIDADES -->
      <div class="bg-navy-dark/95 p-3 border-b border-amareloOvo/30 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-black text-amareloOvo uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-filter text-amareloOvo text-xs"></i> Filtrar Autoridades:
          </span>
          <button onclick="clearAutoridadesFilters()" class="text-[11px] font-extrabold text-slate-300 hover:text-white underline transition">
            Limpar Filtros
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-5 gap-2">
          <!-- Autoridade -->
          <div class="relative">
            <select id="authFilterNome" onchange="renderAutoridadesModal()" class="w-full bg-slate-900 text-white border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amareloOvo appearance-none">
              <option value="">Autoridade (Todas)</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
          </div>

          <!-- Esposas -->
          <div class="relative">
            <select id="authFilterEsposa" onchange="renderAutoridadesModal()" class="w-full bg-slate-900 text-white border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amareloOvo appearance-none">
              <option value="">Esposas (Todas)</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
          </div>

          <!-- Hospedagem -->
          <div class="relative">
            <select id="authFilterHospedagem" onchange="renderAutoridadesModal()" class="w-full bg-slate-900 text-white border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amareloOvo appearance-none">
              <option value="">Hospedagem (Todas)</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
          </div>

          <!-- Assistente -->
          <div class="relative">
            <select id="authFilterAssistente" onchange="renderAutoridadesModal()" class="w-full bg-slate-900 text-white border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amareloOvo appearance-none">
              <option value="">Assistente (Todos)</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
          </div>

          <!-- Motorista -->
          <div class="relative">
            <select id="authFilterMotorista" onchange="renderAutoridadesModal()" class="w-full bg-slate-900 text-white border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amareloOvo appearance-none">
              <option value="">Motorista (Todos)</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
          </div>
        </div>
      </div>

      <div class="p-4 sm:p-6 overflow-y-auto space-y-6 flex-grow" id="autoridadesListContainer"></div>
      <div class="p-3 bg-slate-50 border-t border-slate-100 text-right">
        <button onclick="closeModal('modalAutoridades')" class="px-5 py-2 bg-navy text-white text-sm font-bold rounded-xl hover:bg-navy-dark transition">
          Fechar
        </button>
      </div>
    </div>
  </div>

  <div id="modalAcomodacao" class="fixed inset-0 bg-navy-dark/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-2xl rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
      <div class="p-4 bg-navy text-white flex items-center justify-between border-b border-amareloOvo/30">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-hotel text-amareloOvo text-lg"></i>
          <h3 class="font-extrabold text-lg">Hospedagem dos Convidados</h3>
        </div>
        <button onclick="closeModal('modalAcomodacao')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

    function cleanPhone(p) { return p ? p.replace(/\D/g, '') : ''; }
    function getMapsLink(loc) {
      if (!loc || loc === "-") return "#";
      const cleanLoc = loc.toLowerCase().includes("belém") || loc.toLowerCase().includes("santarém") || loc.toLowerCase().includes("macapá") || loc.toLowerCase().includes("oiapoque") || loc.toLowerCase().includes("barcarena") || loc.toLowerCase().includes("icoaraci") ? loc : `${loc}, Pará - Brasil`;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanLoc)}`;
    }
    function getFlightTrackerLink(flightCode) {
      if (!flightCode || flightCode.includes("Não")) return "#";
      return `https://flightaware.com/live/flight/${encodeURIComponent(flightCode.replace(/\s+/g, ''))}`;
    }

    function toggleFiltersPanel() {
      const content = document.getElementById('filtersContent');
      const icon = document.getElementById('filterToggleIcon');
      if (!content || !icon) return;

      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.classList.add('rotate-180');
      } else {
        content.classList.add('hidden');
        icon.classList.remove('rotate-180');
      }
    }

    function updateActiveFilterBadge() {
      const badge = document.getElementById('activeFiltersBadge');
      if (!badge) return;
      if (activeTipoEventoFilter || activeParticipantesFilter || activeLocalCategoriaFilter) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function autoSelectToday() {
      const today = new Date();
      const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const foundIndex = schedule.findIndex(item => item.date === todayISO);
      selectedDayIndex = foundIndex !== -1 ? foundIndex : 0;
    }

    function openPhotoViewer(photoPath, name, role) {
      const modal = document.getElementById('modalPhotoViewer');
      const img = document.getElementById('modalPhotoViewerImg');
      const nameEl = document.getElementById('modalPhotoViewerName');
      const roleEl = document.getElementById('modalPhotoViewerRole');
      
      if (!modal || !img) return;

      img.src = photoPath;
      img.onerror = function() {
        this.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23002D5E' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";
      };

      if (nameEl) nameEl.innerText = name || '';
      if (roleEl) roleEl.innerText = role || '';

      openModal('modalPhotoViewer');
    }

    function formatAcompanhanteAutoridade(esposa) {
      if (!esposa || esposa === '-') return '';
      const text = esposa.trim();
      const cleanName = text.replace(/^(sra\.|sra|dona)\s*/i, '');
      return `<p class="text-[15px] sm:text-[17px] font-black text-navy leading-snug"><i class="fa-solid fa-user-group text-amareloOvo-dark mr-1.5 text-xs"></i>Sra. ${cleanName}</p>`;
    }

    function formatAcompanhanteVoo(acompanhante) {
      if (!acompanhante || acompanhante === '-') return '';
      const text = acompanhante.trim();
      const isFemale = text.toLowerCase().startsWith('sra.') || text.toLowerCase().startsWith('sra ') || text.toLowerCase().startsWith('dona ');
      
      if (isFemale) {
        const cleanName = text.replace(/^(sra\.|sra|dona)\s*/i, '');
        return `<h4 class="text-base sm:text-lg font-black text-slate-900 leading-tight">Sra. ${cleanName}</h4>`;
      }
      
      return `<h4 class="text-base sm:text-lg font-black text-slate-900 leading-tight">${text}</h4>`;
    }

    function matchEventFilter(evt) {
      if (activeTipoEventoFilter && evt.tipoEvento !== activeTipoEventoFilter) return false;
      if (activeParticipantesFilter) {
        const parts = evt.participants ? evt.participants.toLowerCase() : '';
        const filterLower = activeParticipantesFilter.toLowerCase();
        if (filterLower === 'v alte batista' && !parts.includes('batista') && !parts.includes('comger') && !parts.includes('dn-01')) return false;
        if (filterLower === 'c alte josé fabio' && !parts.includes('josé fabio') && !parts.includes('fabio') && !parts.includes('dn-02')) return false;
        if (filterLower === 'almirantes' && !parts.includes('almirantes') && !parts.includes('alte') && !parts.includes('comger') && !parts.includes('dgn') && !parts.includes('con') && !parts.includes('choc')) return false;
        if (filterLower === 'esposas' && !parts.includes('esposas') && !parts.includes('sra') && !parts.includes('carla')) return false;
      }
      if (activeLocalCategoriaFilter && evt.localCategoria !== activeLocalCategoriaFilter) return false;
      return true;
    }

      autoSelectToday();
      renderTabs();
      renderTimeline();
      renderModalsData();
      renderVoosModal();
      renderViaturasModal();
      setInterval(renderTimeline, 60000);
    });

    function applyFilters() {
      activeTipoEventoFilter = document.getElementById('filterTipoEvento').value;
      activeParticipantesFilter = document.getElementById('filterParticipantes').value;
      activeLocalCategoriaFilter = document.getElementById('filterLocalCategoria').value;
      
      updateActiveFilterBadge();

      const currentDayEvents = schedule[selectedDayIndex].events.filter(matchEventFilter);
      if (currentDayEvents.length === 0) {
        const firstAvailableIndex = schedule.findIndex(day => day.events.some(matchEventFilter));
        if (firstAvailableIndex !== -1) selectedDayIndex = firstAvailableIndex;
      }
      renderTabs();
      renderTimeline();
    }

    function clearFilters() {
      document.getElementById('filterTipoEvento').value = "";
      document.getElementById('filterParticipantes').value = "";
      document.getElementById('filterLocalCategoria').value = "";
      activeTipoEventoFilter = ""; 
      activeParticipantesFilter = ""; 
      activeLocalCategoriaFilter = "";
      updateActiveFilterBadge();
      renderTabs(); 
      renderTimeline();
    }

    function renderTabs() {
      const tabContainer = document.getElementById('daysTabContainer');
      if (!tabContainer) return;
      tabContainer.innerHTML = schedule.map((day, idx) => {
        const hasMatchingEvents = day.events.some(matchEventFilter);
        const isActive = idx === selectedDayIndex && hasMatchingEvents;
        if (!hasMatchingEvents) {
          return `
            <button disabled class="flex-1 min-w-[120px] px-3.5 py-2.5 rounded-xl font-black text-xs sm:text-sm text-center flex flex-col items-center justify-center border bg-slate-800/40 text-slate-500 border-slate-700/30 cursor-not-allowed opacity-50">
              <span class="text-[10px] tracking-wider uppercase font-bold text-slate-500">${day.weekDay}</span>
              <span class="text-sm sm:text-base font-black">${day.dayLabel}</span>
            </button>
          `;
        }
        return `
          <button onclick="switchDay(${idx})" class="flex-1 min-w-[120px] px-3.5 py-2.5 rounded-xl font-black text-xs sm:text-sm transition-all text-center flex flex-col items-center justify-center border ${
            isActive ? 'bg-amareloOvo text-navy-dark border-amareloOvo shadow-md font-extrabold scale-100' : 'bg-white/10 text-slate-200 border-white/10 hover:bg-white/20'
          }">
            <span class="text-[10px] tracking-wider uppercase font-extrabold ${isActive ? 'text-navy-dark/80' : 'text-slate-300'}">${day.weekDay}</span>
            <span class="text-sm sm:text-base font-black">${day.dayLabel}</span>
          </button>
        `;
      }).join('');
    }

    function switchDay(index) {
      selectedDayIndex = index;
      renderTabs();
      renderTimeline();
    }

    function renderTimeline() {
      const dayData = schedule[selectedDayIndex];
      const container = document.getElementById('timelineContainer');
      const titleEl = document.getElementById('currentDayTitle');
      const countEl = document.getElementById('eventCountBadge');

      if (!container || !dayData) return;
      if (titleEl) titleEl.innerText = `${dayData.weekDay.toUpperCase()} — ${dayData.dayLabel}`;

      const now = new Date();
      const currentHours = now.getHours() + (now.getMinutes() / 60);
      const todayISO = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const isToday = dayData.date === todayISO;
      const filteredEvents = dayData.events.filter(matchEventFilter);

      if (countEl) countEl.innerText = `${filteredEvents.length} Atividades`;

      if (filteredEvents.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-slate-50 border border-slate-200 rounded-2xl text-slate-500 font-bold text-xs sm:text-sm">
            <i class="fa-solid fa-filter-circle-xmark text-2xl text-slate-400 mb-2 block"></i>
            Nenhum evento encontrado para os filtros selecionados neste dia.
          </div>
        `;
        return;
      }

      let renderedAnyRedLine = false;

      container.innerHTML = filteredEvents.map((evt) => {
        const [h, m] = evt.time.split(':').map(Number);
        const eventStartHour = h + (m / 60);
        const isCurrent = isToday && currentHours >= eventStartHour && currentHours < evt.endHour;

        let redLineHtml = '';
        if (isToday && !renderedAnyRedLine && currentHours <= eventStartHour) {
          renderedAnyRedLine = true;
          redLineHtml = `
            <div class="relative flex items-center my-4">
              <div class="flex-grow border-t-2 border-red-500"></div>
              <span class="mx-3 px-3 py-1 bg-red-500 text-white text-[11px] font-black uppercase rounded-full shadow-md tracking-wider flex items-center gap-1.5 animate-pulse">
                <i class="fa-solid fa-clock"></i> Horário Atual
              </span>
              <div class="flex-grow border-t-2 border-red-500"></div>
            </div>
          `;
        }

        return `
          ${redLineHtml}
          <div class="group">
            <div class="p-4 sm:p-5 rounded-2xl border transition-all ${
              isCurrent ? 'bg-red-50/70 border-red-300 shadow-md ring-2 ring-red-200' : 'bg-white border-slate-200 hover:border-slate-300 hover:shadow-sm'
            }">
              <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
                <div class="flex items-center gap-2">
                  <span class="text-base sm:text-lg font-black text-navy font-mono bg-navy/5 px-3 py-1 rounded-lg border border-navy/10">
                    ${evt.time}
                  </span>
                  ${evt.tipoEvento ? `
                    <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-amber-100 text-amber-900 border border-amber-300">
                      ${evt.tipoEvento}
                    </span>
                  ` : ''}
                  ${evt.uniform ? `
                    <span class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black bg-amareloOvo/20 text-navy-dark border-2 border-amareloOvo shadow-sm flex items-center gap-1.5">
                      <i class="fa-solid fa-shirt text-amareloOvo-dark"></i>
                      <span>Uniforme: ${evt.uniform}</span>
                    </span>
                  ` : ''}
                  ${isCurrent ? `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-black uppercase bg-red-600 text-white animate-pulse">AGORA</span>` : ''}
                </div>
                
                <div class="flex items-center gap-2">
                  <button onclick="showEventDetails('${evt.id}')" title="Mais informações" class="w-9 h-9 rounded-xl bg-blue-100 hover:bg-blue-200 text-blue-700 flex items-center justify-center transition active:scale-95 border border-blue-300 shadow-sm">
                    <i class="fa-solid fa-circle-info text-base"></i>
                  </button>
                </div>
              </div>

              <h3 class="text-base sm:text-lg font-extrabold text-slate-900 leading-snug mb-2.5">
                ${evt.activity}
              </h3>

              <div class="flex flex-wrap items-center gap-2 text-xs sm:text-sm text-slate-600">
                ${evt.location ? `
                  <a href="${getMapsLink(evt.location)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-slate-800 font-bold hover:text-navy hover:underline transition bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                    <i class="fa-solid fa-location-dot text-red-500"></i>
                    <span class="truncate max-w-[200px] sm:max-w-xs">${evt.location}</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-slate-400"></i>
                  </a>
                ` : ''}


                ${evt.flight && isCommercial
